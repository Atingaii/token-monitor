name: Extract Dashboard Source

on:
  push:
    branches:
      - fix/dashboard-clean-branding
    paths:
      - '.github/workflows/extract-dashboard-source.yml'
      - 'web-ui/src/app.part.*'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-clean-branding

      - name: Reconstruct editable dashboard source
        shell: bash
        run: |
          cat web-ui/src/app.part.* | base64 -d | gunzip > web-ui/src/app.tsx
          test -s web-ui/src/app.tsx

      - name: Commit reconstructed source
        shell: bash
        run: |
          if git diff --quiet -- web-ui/src/app.tsx && git ls-files --error-unmatch web-ui/src/app.tsx >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-ui/src/app.tsx
          git commit -m 'chore(web): expose editable Figma dashboard source'
          git push origin HEAD:fix/dashboard-clean-branding
