name: Deploy Dashboard

# Fast web-only deployment. Expensive Rust/native CI is intentionally manual.
on:
  push:
    branches: [main]
    paths:
      - 'web-ui/**'
      - 'web/device-index.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package.json

      - name: Prepare Figma application source
        shell: bash
        run: |
          if [ ! -s web-ui/src/app.tsx ]; then
            cat web-ui/src/app.part.* | base64 -d | gunzip > web-ui/src/app.tsx
          fi
          test -s web-ui/src/app.tsx
          grep -q "FAST_SUBSCRIPTION_MULTIPLIER = 2.5" web-ui/src/app.tsx
          grep -q "model_prices_and_context_window.json" web-ui/src/app.tsx

      - name: Apply audited accounting and UI policy
        working-directory: web-ui
        run: |
          python3 patch-pricing-policy.py
          python3 patch-session-persistence.py
          grep -q "subscriptionSpeedMultiplier" src/app.tsx
          ! grep -q "FAST_SUBSCRIPTION_MULTIPLIER" src/app.tsx
          grep -q "使用统计" src/app.tsx
          grep -q "缓存命中率" src/app.tsx
          grep -q "按设备" src/app.tsx
          grep -q "按路由提供商" src/app.tsx
          ! grep -q "高级用量分析" src/app.tsx
          ! grep -q "repoBadge={dataset.repo}" src/app.tsx
          ! grep -q "pricingBadge={dataset.pricing.source}" src/app.tsx
          ! grep -q "Codex Fast: GPT-5.6/5.5 2.5×" src/app.tsx
          grep -q "REMEMBERED_WORKSPACE_KEY_PREFIX" src/app.tsx
          grep -q "loadDashboardWithKey" src/app.tsx
          grep -q "const \[workspaceKeyValue, setWorkspaceKeyValue\]" src/app.tsx
          grep -q "rememberWorkspaceKey(next.repo, key)" src/app.tsx
          grep -q "forgetRememberedWorkspaceKey(repoFromLocation())" src/app.tsx
          grep -q "正在恢复登录" src/app.tsx
          ! grep -q "setPassword(nextPassword)" src/app.tsx
          ! grep -q "loadDashboard(password)" src/app.tsx
          test -s public/token-monitor-icon.svg

      - name: Install dashboard dependencies
        working-directory: web-ui
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: web-ui
        run: |
          npm run typecheck
          npm run build

      - name: Add zero-API device index fallback
        shell: bash
        run: |
          cp web/device-index.json web-ui/dist/device-index.json
          test -s web-ui/dist/device-index.json
          test -s web-ui/dist/token-monitor-icon.svg

      - name: Check GitHub Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::GitHub Pages is not enabled for this repository."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ui/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
