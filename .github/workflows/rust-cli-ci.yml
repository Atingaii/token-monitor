name: Rust CLI CI

on:
  push:
    branches: [main, feat/github-ledger-pages, feat/public-dashboard-v101]
  pull_request:

permissions:
  contents: read

jobs:
  cli-matrix:
    name: CLI / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
          - label: linux-arm64
            os: ubuntu-24.04-arm
          - label: windows-x64
            os: windows-latest
          - label: windows-arm64
            os: windows-11-arm
          - label: macos-arm64
            os: macos-latest
          - label: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Platform evidence
        run: rustc -vV
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Unit tests
        run: cargo test --workspace --all-targets
      - name: Release build smoke test
        run: cargo build --release --workspace
      - name: CLI surface smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/token-monitor --version
          ./target/release/token-monitor clients
      - name: CLI surface smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/token-monitor.exe --version
          ./target/release/token-monitor.exe clients

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check web/analytics.js
          node --check web/app.js
      - name: Analytics unit tests
        run: node web/analytics.test.cjs
      - name: Public dashboard and privacy regression checks
        shell: bash
        run: |
          grep -q 'public.json' web/app.js
          grep -q 'sidebarToggle' web/index.html
          ! grep -E -i 'type="password"|id="unlock|Dashboard key' web/index.html || (echo 'Normal dashboard UI must not require a browser key/password' && exit 1)
          ! grep -R -i -E 'auth\.json|prompt[^a-z]|assistant response|api[_ -]?key' web/*.js || (echo 'Dashboard code must not depend on private session payloads or credentials' && exit 1)

  upstream-parser-suite:
    name: Tokscale v4.14.0 parser regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: junhoyeo/tokscale
          ref: v4.14.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all tokscale-core parser/scanner tests
        run: cargo test -p tokscale-core --all-targets
