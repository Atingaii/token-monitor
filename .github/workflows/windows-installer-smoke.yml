name: Windows Installer Smoke

on:
  push:
    branches: [main]
    paths:
      - 'install.ps1'
      - '.github/workflows/windows-installer-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
          - label: windows-arm64
            os: windows-11-arm
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 7
        shell: pwsh
        run: |
          $env:TOKEN_MONITOR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'token-monitor-pwsh7'
          ./install.ps1
          $binary = Join-Path $env:TOKEN_MONITOR_INSTALL_DIR 'token-monitor.exe'
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.1\.2') { throw "Unexpected version: $version" }
          & $binary clients | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke failed' }
      - name: Windows PowerShell 5.1
        shell: cmd
        run: >-
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command
          "$env:TOKEN_MONITOR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'token-monitor-wps51';
          & './install.ps1';
          $binary = Join-Path $env:TOKEN_MONITOR_INSTALL_DIR 'token-monitor.exe';
          $version = & $binary --version;
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '1\.1\.2') { throw ('Unexpected version: ' + $version) };
          & $binary clients | Out-Null;
          if ($LASTEXITCODE -ne 0) { throw 'clients smoke failed' }"
