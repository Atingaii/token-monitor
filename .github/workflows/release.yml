name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: token-monitor-linux-x86_64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: token-monitor-linux-aarch64
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            asset: token-monitor-macos-x86_64
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            asset: token-monitor-macos-aarch64
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross for Linux ARM64
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build target
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --workspace --target '${{ matrix.target }}'
          else
            cargo build --release --workspace --target '${{ matrix.target }}'
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p out/package
          cp 'target/${{ matrix.target }}/release/token-monitor' out/package/token-monitor
          chmod +x out/package/token-monitor
          tar -C out/package -czf 'out/${{ matrix.asset }}.tar.gz' token-monitor
          cd out
          shasum -a 256 '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}.tar.gz
            out/${{ matrix.asset }}.sha256
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            asset: token-monitor-windows-x86_64
          - target: aarch64-pc-windows-msvc
            asset: token-monitor-windows-aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/token-monitor.exe" "out/package/token-monitor.exe"
          Compress-Archive -Force "out/package/token-monitor.exe" "out/${{ matrix.asset }}.zip"
          $hash = (Get-FileHash "out/${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -NoNewline "out/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            out/${{ matrix.asset }}.zip
            out/${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi
