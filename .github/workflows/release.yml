name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            asset: token-monitor-linux-x86_64
          - label: linux-arm64
            os: ubuntu-24.04-arm
            asset: token-monitor-linux-aarch64
          - label: macos-arm64
            os: macos-latest
            asset: token-monitor-macos-aarch64
          - label: macos-x64
            os: macos-15-intel
            asset: token-monitor-macos-x86_64
          - label: windows-x64
            os: windows-latest
            asset: token-monitor-windows-x86_64
          - label: windows-arm64
            os: windows-11-arm
            asset: token-monitor-windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Platform evidence
        run: rustc -vV
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build release
        run: cargo build --release --workspace
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out/package
          cp target/release/token-monitor out/package/token-monitor
          chmod +x out/package/token-monitor
          tar -C out/package -czf 'out/${{ matrix.asset }}.tar.gz' token-monitor
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          else
            shasum -a 256 '${{ matrix.asset }}.tar.gz' > '${{ matrix.asset }}.sha256'
          fi
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/package | Out-Null
          Copy-Item "target/release/token-monitor.exe" "out/package/token-monitor.exe"
          Compress-Archive -Force "out/package/token-monitor.exe" "out/${{ matrix.asset }}.zip"
          $hash = (Get-FileHash "out/${{ matrix.asset }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}.zip" | Set-Content -NoNewline "out/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi
