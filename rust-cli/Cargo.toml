[package]
name = "token-monitor"
version = "1.0.0"
edition = "2021"
authors = ["Atingaii"]
license = "MIT"
description = "Serverless cross-device token usage analytics for AI coding tools"
repository = "https://github.com/Atingaii/token-monitor"

[[bin]]
name = "token-monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
hex = "0.4"
hostname = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.8"
walkdir = "2"
tokscale-core = { git = "https://github.com/junhoyeo/tokscale", rev = "1ec865d4e9e5adf157efb9f5c2dfaf29630d71e5", package = "tokscale-core" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
